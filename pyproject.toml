[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cminor-compiler"
version = "1.0.0"
description = "Course-defined C Minor compiler with a student-owned LLVM lowering stage"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cminorcc = "cminor.driver:main"

[tool.setuptools]
packages = ["cminor"]
